[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-kg-builder"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "PyYAML==6.0.2",
  "groq==0.13.1",
  "google-genai==0.8.0",
  "sentence-transformers==3.3.1",
  "rapidfuzz==3.11.0",
  "numpy==2.2.1",
  "neo4j==5.27.0",
]

[project.optional-dependencies]
eval = ["faiss-cpu==1.9.0.post1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ekg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
