<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build entity graph</title><link rel="stylesheet" href="/viewer.css"></head>
<body data-max-input-chars="100000"><main><h1>Build entity graph</h1><form id="build-form"><label for="source-text">Text</label><textarea id="source-text" required></textarea><output id="text-count" aria-live="polite">0 / 100000</output><label for="context">Context (optional)</label><input id="context" type="text"><label for="entity-config">Entity config YAML (optional)</label><input id="entity-config" type="file" accept=".yaml,.yml,text/yaml"><label for="api-key">API key</label><input id="api-key" type="password" autocomplete="off" required><button type="submit">Build</button></form><p id="status" aria-live="polite"></p><p id="error" role="alert"></p><p id="share"></p><div id="graph" data-graph aria-label="knowledge graph"></div><aside id="evidence" data-evidence></aside></main><script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js" crossorigin="anonymous"></script><script type="module" src="/build.js"></script></body>
</html>
